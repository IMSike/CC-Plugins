name: Plugins

# Validates the marketplace and every plugin, and runs the plugins' tests,
# with the Claude Code CLI. No account is needed: nothing calls the API.
# See CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate and test each plugin
        run: |
          failed=0
          for plugin in plugins/*/; do
            echo "::group::$plugin"
            claude plugin validate "$plugin" || failed=1
            if find "$plugin" -name '*.test.ts' -o -name '*.test.tsx' | grep -q .; then
              claude plugin test "$plugin" || failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
