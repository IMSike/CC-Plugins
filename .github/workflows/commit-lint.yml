name: Commit messages

# Commit messages and pull request titles must follow the Angular convention:
# <type>(<scope>)?: <subject>, type in build, ci, docs, feat, fix, perf, refactor, revert, test.
# See CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check messages
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          pattern='^(build|ci|docs|feat|fix|perf|refactor|revert|test)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          check() {
            if printf '%s' "$1" | grep -Eq "$pattern"; then
              echo "ok   $1"
            else
              echo "::error::Not an Angular commit message: $1"
              failed=1
            fi
          }
          if [ "$EVENT" = "pull_request" ]; then
            check "$PR_TITLE"
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER_SHA"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi
          while IFS= read -r subject; do
            [ -n "$subject" ] && check "$subject"
          done < <(git log --no-merges --format=%s $range)
          exit $failed
