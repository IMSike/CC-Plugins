name: Version

# Tags each push to main with a semantic version and publishes a GitHub release (no changelog).
# - first run: v0.0.0
# - a feat commit since the last tag: minor (0.X.0)
# - any other commit: patch (0.0.X)
# - major (X.0.0): only on demand, by running this workflow manually with "major".
# See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --merged HEAD | head -n 1)
          if [ -z "$last" ]; then
            next=v0.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            subjects=$(git log --no-merges --format=%s "$last..HEAD")
            if [ "$BUMP" = "major" ]; then
              next="v$((major + 1)).0.0"
            elif [ -z "$subjects" ]; then
              echo "No commit since $last: nothing to release."
              exit 0
            elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?!?: '; then
              next="v$major.$((minor + 1)).0"
            else
              next="v$major.$minor.$((patch + 1))"
            fi
          fi
          echo "Last: ${last:-none}, next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --target "$GITHUB_SHA" --title "$NEXT" --notes "Version $NEXT."
